<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anfield Stadium Experience | Interactive Blueprint & European Nights</title>
  <style>
    /* ==========================================================
       1. DESIGN TOKENS & ANFIELD NIGHT PALETTE
       ========================================================== */
    :root {
      --red: #c8102e;
      --red-deep: #6b0516;
      --red-glow: rgba(200, 16, 46, 0.5);
      --gold: #f6eb61;
      --teal: #00b2a9;
      --bg-night: #07080b;
      --bg-card: #11141c;
      --bg-elevated: #181c26;
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-night);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(200, 16, 46, 0.25), transparent 50%),
        radial-gradient(circle at 85% 90%, rgba(0, 178, 169, 0.12), transparent 40%);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ==========================================================
       2. HEADER & HERO
       ========================================================== */
    header {
      padding: 1.2rem 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 8, 11, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-weight: 900;
      letter-spacing: 1.5px;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      background: var(--red);
      color: var(--gold);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--gold); }

    .hero {
      text-align: center;
      padding: 4rem 1.5rem 3rem;
      max-width: 820px;
      margin: 0 auto;
    }

    .hero-kicker {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* ==========================================================
       3. CONTAINER & SECTION HEADERS
       ========================================================== */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1rem 1.5rem 5rem;
    }

    section { margin-bottom: 4.5rem; }

    .sec-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .sec-title h2 { font-size: 1.65rem; font-weight: 800; }
    .sec-title span { color: var(--gold); font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; }

    /* ==========================================================
       4. CSS-DRAWN INTERACTIVE ANFIELD STADIUM MAP
       ========================================================== */
    .stadium-layout {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 2rem;
      align-items: center;
    }

    @media (max-width: 880px) {
      .stadium-layout { grid-template-columns: 1fr; }
    }

    .stadium-blueprint {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      display: grid;
      grid-template-areas:
        ". kenny ."
        "kop pitch anfieldrd"
        ". main .";
      grid-template-columns: 95px 1fr 95px;
      grid-template-rows: 85px 210px 95px;
      gap: 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .stand {
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      padding: 8px;
      font-weight: 800;
      font-size: 0.8rem;
      transition: all 0.25s ease;
    }

    .stand small {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .stand:hover, .stand.active {
      background: var(--red);
      border-color: var(--gold);
      transform: scale(1.03);
      box-shadow: 0 0 20px var(--red-glow);
    }

    .stand:hover small, .stand.active small { color: var(--gold); }

    .stand-kenny { grid-area: kenny; }
    .stand-kop { grid-area: kop; writing-mode: vertical-rl; transform: rotate(180deg); }
    .stand-kop:hover, .stand-kop.active { transform: rotate(180deg) scale(1.03); }
    .stand-anfieldrd { grid-area: anfieldrd; writing-mode: vertical-rl; }
    .stand-main { grid-area: main; }

    /* Pure CSS Stadium Pitch Center */
    .stadium-pitch {
      grid-area: pitch;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: repeating-linear-gradient(
        90deg,
        #14532d 0%,
        #14532d 12.5%,
        #166534 12.5%,
        #166534 25%
      );
      position: relative;
      display: grid;
      place-items: center;
    }

    .stadium-pitch::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 2px;
      background: rgba(255, 255, 255, 0.65);
    }

    .stadium-pitch::after {
      content: '';
      width: 56px;
      height: 56px;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 50%;
    }

    .stand-inspector {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--red);
      border-radius: 16px;
      padding: 1.8rem;
    }

    .stand-inspector h3 { font-size: 1.5rem; margin-bottom: 0.4rem; }
    .stand-meta {
      display: inline-block;
      background: rgba(246, 235, 97, 0.12);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* ==========================================================
       5. EUROPEAN NIGHTS INTERACTIVE ARCHIVE
       ========================================================== */
    .nights-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .night-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.65rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .night-btn.active, .night-btn:hover {
      background: var(--red);
      color: #fff;
      border-color: var(--gold);
    }

    .night-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2rem;
      align-items: center;
    }

    @media (max-width: 780px) {
      .night-card { grid-template-columns: 1fr; }
    }

    .score-banner {
      background: linear-gradient(135deg, var(--red), var(--red-deep));
      padding: 1.8rem;
      border-radius: 14px;
      text-align: center;
      border: 1px solid rgba(246, 235, 97, 0.35);
    }

    .score-banner .comp {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      font-weight: 800;
    }

    .score-banner .big-score {
      font-size: 2.6rem;
      font-weight: 900;
      margin: 0.5rem 0;
    }

    .goal-list {
      list-style: none;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .goal-list li {
      background: var(--bg-elevated);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.88rem;
      border-left: 3px solid var(--gold);
    }

    /* ==========================================================
       6. ANFIELD ATMOSPHERE & DECIBEL VISUALIZER
       ========================================================== */
    .atmosphere-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
      text-align: center;
    }

    .equalizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 8px;
      height: 90px;
      margin: 1.5rem 0;
    }

    .eq-bar {
      width: 12px;
      height: 18px;
      background: linear-gradient(to top, var(--red), var(--gold));
      border-radius: 6px;
      transition: height 0.18s ease;
    }

    .chant-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chant-trigger {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chant-trigger:hover {
      border-color: var(--gold);
      background: var(--red);
    }

    .lyric-banner {
      margin-top: 1.2rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      min-height: 28px;
    }

    footer {
